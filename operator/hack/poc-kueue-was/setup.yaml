apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata: {name: poc-tas}
spec:
  namespaceSelector: {}
  resourceGroups:
  - coveredResources: [cpu, memory]
    flavors: [{name: poc-tas, resources: [{name: cpu, nominalQuota: "100"}, {name: memory, nominalQuota: 100Gi}]}]
