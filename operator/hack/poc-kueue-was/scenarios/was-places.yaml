# Run with wasMode WASTopology. Same shape as split.yaml, on the non-TAS queue: Kueue only checks quota
# and pins nothing, so kube-scheduler's WAS cycle picks the rack. Only poc-rack-big fits all 4 pods.
apiVersion: grove.io/v1alpha1
kind: PodCliqueSet
metadata:
  name: poc-was-places
  namespace: default
  labels: {kueue.x-k8s.io/queue-name: poc-quota}
spec:
  replicas: 1
  template:
    topologyConstraint: {topologyName: poc-topology, pack: {required: rack}}
    cliques:
    - name: prefill
      spec:
        roleName: prefill
        replicas: 2
        minAvailable: 2
        podSpec: &podSpec
          schedulerName: kueue
          terminationGracePeriodSeconds: 1
          tolerations: [{key: poc.grove.io/was, operator: Exists, effect: NoSchedule}]
          containers: [{name: main, image: busybox, resources: {requests: {cpu: "3", memory: 1Gi}}}]
    - name: decode
      spec:
        roleName: decode
        replicas: 2
        minAvailable: 2
        podSpec: *podSpec
