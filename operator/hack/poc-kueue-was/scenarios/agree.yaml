# Run with wasMode Full. One clique and a rack required for the whole PodCliqueSet.
# Kueue's TAS picks the rack (best fit: poc-rack-small) and pins each pod to a node. The WAS root
# CompositePodGroup also requires one rack, and the pinned nodes satisfy it, so both agree.
apiVersion: grove.io/v1alpha1
kind: PodCliqueSet
metadata:
  name: poc-agree
  namespace: default
  labels: {kueue.x-k8s.io/queue-name: poc-tas}
spec:
  replicas: 1
  template:
    topologyConstraint: {topologyName: poc-topology, pack: {required: rack}}
    cliques:
    - name: worker
      spec:
        roleName: worker
        replicas: 2
        minAvailable: 2
        podSpec:
          schedulerName: kueue
          terminationGracePeriodSeconds: 1
          tolerations: [{key: poc.grove.io/was, operator: Exists, effect: NoSchedule}]
          containers: [{name: main, image: busybox, resources: {requests: {cpu: "3", memory: 1Gi}}}]
